<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Text</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <header id="status-bar">
      <div id="location-name">Route 1</div>
      <div id="money-count">Money: ¥3000</div>
      <div id="badge-count">Badges: 0/8</div>
    </header>

    <main id="display-area">
      <p class="log-entry">Welcome to the Kanto region!</p>
      <p class="log-entry">You are on Route 1, a peaceful path connecting Pallet Town and Viridian City.</p>
    </main>

    <section id="party-bar">
      <span class="party-label">Party:</span>
      <span id="party-list">Charmander (Lv. 5)</span>
    </section>

    <nav id="action-menu">
      <!-- State 1: Route Actions -->
      <div id="route-actions" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
        <button id="btn-encounter" class="btn">Encounter</button>
        <button id="btn-fight" class="btn">Fight</button>
        <button id="btn-explore" class="btn">Explore</button>
        <button id="btn-travel" class="btn">Travel</button>
        <button id="btn-menu" class="btn secondary" style="grid-column: span 2;">Menu</button>
        <button id="btn-pokemon-center" class="btn" style="display: none;">Heal</button>
        <button id="btn-shop" class="btn" style="display: none;">Shop</button>
      </div>

      <!-- State 2: System Menu (Hidden) -->
      <div id="system-menu" style="display: none; grid-template-columns: repeat(2, 1fr); gap: 8px;">
        <button id="btn-bag" class="btn">Bag</button>
        <button id="btn-pokedex" class="btn">Pokédex</button>
        <button id="btn-save" class="btn">Save / Load</button>
        <button id="btn-back-menu" class="btn secondary">Back</button>
      </div>

      <!-- State 3: Travel Menu (Hidden) -->
      <div id="travel-menu" style="display: none; display: flex; flex-direction: column; gap: 8px;">
        <!-- Javascript will inject available destinations here dynamically -->
        <div id="travel-destinations"></div>
        <button id="btn-back-travel" class="btn secondary">Cancel</button>
      </div>

      <!-- State 4: Battle Actions (Hidden) -->
      <div id="battle-actions" style="display: none;">
        <button id="btn-move-0" class="btn">Scratch</button>
        <button id="btn-move-1" class="btn">Growl</button>
        <button id="btn-move-2" class="btn">Ember</button>
        <button id="btn-move-3" class="btn">Smokescreen</button>
        <button id="btn-battle-bag" class="btn btn-full">Bag</button>
        <button id="btn-run" class="btn btn-full">Run</button>
      </div>

      <!-- State 5: Dynamic List Menus (Shop & PC) -->
      <div id="dynamic-menu" style="display: none; flex-direction: column; gap: 8px;">
        <div id="dynamic-content" style="display: grid; grid-template-columns: 1fr; gap: 4px; max-height: 160px; overflow-y: auto;">
          <!-- JavaScript will generate list items here -->
        </div>
        <div id="dynamic-controls" style="display: flex; gap: 8px; flex-wrap: wrap;">
          <!-- JavaScript will generate control buttons (Buy/Sell/Back) here -->
        </div>
      </div>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
