<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Text</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <header id="status-bar" style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; border-bottom: 2px solid #ccc;">
      <div id="location-name" style="font-weight: bold; font-size: 1.2em; text-align: center;">Pallet Town</div>
      <div style="display: flex; justify-content: space-between; font-size: 0.9em; color: #555;">
        <span id="money-count">Money: ¥3000</span>
        <span id="pokedex-count">Pokedex: 0/151</span>
        <span id="badge-count">Badges: 0/8</span>
      </div>
    </header>

    <main id="display-area">
    </main>
    
    <section id="party-bar">
      <span class="party-label">Party:</span>
      <span id="party-list"></span>
    </section>

    <nav id="action-menu">
      <!-- State 1: Route Actions -->
      <div id="route-actions" style="display: none; grid-template-columns: repeat(2, 1fr); gap: 8px;">
        <button id="btn-encounter" class="btn">Encounter</button>
        <button id="btn-explore" class="btn">Explore</button>
        <button id="btn-fight" class="btn">Fight</button>
        <button id="btn-travel" class="btn">Journey</button>        
        <button id="btn-interact" class="btn">Interact</button>
        <button id="btn-fly" class="btn">Fly</button>
        <button id="btn-pokemon-center" class="btn" style="display: none;">Pokémon Center</button>
        <button id="btn-shop" class="btn" style="display: none;">Poké Mart</button>
        <button id="btn-menu" class="btn secondary" style="grid-column: span 2;">Menu</button>
      </div>

      <!-- State 2: System Menu (Hidden) -->
      <div id="system-menu" style="display: none; grid-template-columns: repeat(2, 1fr); gap: 8px;">
        <button id="btn-bag" class="btn">Bag</button>
        <button id="btn-pokemon" class="btn">Pokémon</button>
        <button id="btn-pokedex" class="btn">Pokédex</button>
        <button id="btn-save" class="btn">Save / Load</button>
        <button id="btn-back-menu" class="btn secondary" style="grid-column: span 2;">Back</button>
      </div>

      <!-- State 3: Travel Menu (Hidden) -->
      <div id="travel-menu" style="display: none; flex-direction: column; gap: 8px;">
        <!-- Javascript will inject available destinations here dynamically -->
        <div id="travel-destinations"></div>
        <button id="btn-back-travel" class="btn secondary">Cancel</button>
      </div>

      <!-- State 4: Battle Actions (Hidden) -->
      <div id="battle-actions" style="display: none;">
        <button id="btn-move-0" class="btn">Scratch</button>
        <button id="btn-move-1" class="btn">Growl</button>
        <button id="btn-move-2" class="btn">Ember</button>
        <button id="btn-move-3" class="btn">Smokescreen</button>
        <button id="btn-battle-bag" class="btn btn-full">Bag</button>
        <button id="btn-run" class="btn btn-full">Run</button>
      </div>

      <!-- State 5: Dynamic List Menus (Shop & PC) -->
      <div id="dynamic-menu" style="display: none; flex-direction: column; gap: 8px;">
        <div id="dynamic-content" style="display: grid; grid-template-columns: 1fr; gap: 4px; max-height: 160px; overflow-y: auto;">
          <!-- JavaScript will generate list items here -->
        </div>
        <div id="dynamic-controls" style="display: flex; gap: 8px; flex-wrap: wrap;">
          <!-- JavaScript will generate control buttons (Buy/Sell/Back) here -->
        </div>
      </div>

      <!-- State 6: Starter Selection (Hidden) -->
      <div id="starter-menu" style="display: none; flex-direction: column; gap: 12px; text-align: center;">
        <div style="font-weight: bold; font-size: 1.1em;">Choose your Starter:</div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
          <button id="btn-starter-bulbasaur" class="btn" data-id="bulbasaur">Bulbasaur</button>
          <button id="btn-starter-charmander" class="btn" data-id="charmander">Charmander</button>
          <button id="btn-starter-squirtle" class="btn" data-id="squirtle">Squirtle</button>
        </div>
        
        <hr style="width: 100%; border: 1px solid #ccc; margin: 4px 0;">
        
        <div style="font-weight: bold; font-size: 1.1em;">Or continue your journey:</div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
          <button id="btn-load-game" class="btn secondary">Load Local</button>
          <button id="btn-import-save" class="btn secondary">Import Save</button>
          <input type="file" id="input-import-file" style="display: none;" accept=".json">
        </div>
      </div>

      <!-- State 7: Party Target Selection (Hidden) -->
      <div id="party-select-menu" style="display: none; flex-direction: column; gap: 8px;">
        <div id="party-select-list" style="display: grid; grid-template-columns: 1fr; gap: 4px;">
          <!-- JavaScript will inject party members as buttons here -->
        </div>
        <button id="btn-cancel-target" class="btn secondary">Cancel</button>
      </div>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
